server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: myk666666
  redis:
    host: localhost
    port: 6379
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
# application.yml
rocketmq:
  name-server: localhost:9876  # NameServer 地址
  producer:
    group: seckill_producer_group  # 生产者组名
    send-message-timeout: 3000     # 发送消息超时时间(毫秒)
    retry-times-when-send-failed: 3  # 失败重试次数
    max-message-size: 4096         # 最大消息大小(字节)
    compress-message-body-threshold: 4096  # 消息压缩阈值
knife4j:
  enable: true
  setting:
    language: zh-CN